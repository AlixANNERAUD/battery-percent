<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">Battery voltage to state of charge curves built into battery-percent</title>
<desc id="desc">Open-circuit voltage against state of charge for LiPo, Li-ion 18650 and LiFePO4 cells, and for NiMH and alkaline AA cells.</desc>
<rect x="0.5" y="0.5" width="959" height="439" rx="12" fill="#1a1a19" stroke="#2e2e2c"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="32" y="44" font-size="20" font-weight="600" fill="#f0efec">Voltage in, battery percentage out</text>
<text x="32" y="68" font-size="14" fill="#c3c2b7">Built-in discharge curves, per cell, from datasheets and lab measurements</text>
<text x="88" y="96" font-size="14" font-weight="600" fill="#f0efec">Lithium cells</text>
<line x1="88" y1="114" x2="102" y2="114" stroke="#3987e5" stroke-width="2" stroke-linecap="round"/>
<text x="108" y="118" font-size="12" fill="#c3c2b7">LiPo</text>
