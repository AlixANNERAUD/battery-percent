[package]
name = "battery-percent"
version = "2.0.0"
edition = "2021"
rust-version = "1.71"
description = "Hardware-agnostic battery state-of-charge estimation from cell voltage, backed by a portable C core"
authors = ["Alix ANNERAUD <alix@anneraud.fr>"]
license = "MIT"
repository = "https://github.com/AlixANNERAUD/Battery-Percent"
readme = "README.md"
keywords = ["battery", "embedded", "no-std", "lipo", "state-of-charge"]
categories = ["embedded", "no-std", "hardware-support"]
links = "battery_percent"
build = "build.rs"
include = [
    "/src/lib.rs",
    "/src/battery_percent.c",
    "/include/battery_percent.h",
    "/build.rs",
    "/README.md",
    "/LICENSE",
    "/Changelog.md",
]

[lib]
name = "battery_percent"
path = "src/lib.rs"

[build-dependencies]
cc = "1"
