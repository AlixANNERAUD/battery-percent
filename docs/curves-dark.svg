<text x="170" y="118" font-size="12" fill="#c3c2b7">Li-ion 18650</text>
<line x1="268" y1="114" x2="282" y2="114" stroke="#199e70" stroke-width="2" stroke-linecap="round"/>
<text x="288" y="118" font-size="12" fill="#c3c2b7">LiFePO4</text>
<line x1="88" y1="366.8" x2="448" y2="366.8" stroke="#262625" stroke-width="1"/>
<text x="78" y="370.8" font-size="12" text-anchor="end" fill="#9b9a92">2.5 V</text>
<line x1="88" y1="301.1" x2="448" y2="301.1" stroke="#262625" stroke-width="1"/>
<text x="78" y="305.1" font-size="12" text-anchor="end" fill="#9b9a92">3.0 V</text>
<line x1="88" y1="235.3" x2="448" y2="235.3" stroke="#262625" stroke-width="1"/>
<text x="78" y="239.3" font-size="12" text-anchor="end" fill="#9b9a92">3.5 V</text>
<line x1="88" y1="169.5" x2="448" y2="169.5" stroke="#262625" stroke-width="1"/>
<text x="78" y="173.5" font-size="12" text-anchor="end" fill="#9b9a92">4.0 V</text>
<line x1="88" y1="380" x2="448" y2="380" stroke="#3d3d3a" stroke-width="1"/>
<text x="88.0" y="400" font-size="12" text-anchor="middle" fill="#9b9a92">0%</text>
<text x="178.0" y="400" font-size="12" text-anchor="middle" fill="#9b9a92">25%</text>
<text x="268.0" y="400" font-size="12" text-anchor="middle" fill="#9b9a92">50%</text>
