name: ci

on:
  push:
  pull_request:

jobs:
  c:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DBATTERY_PERCENT_WERROR=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitize:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build-asan
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_BUILD_TYPE=Debug
          -DBATTERY_PERCENT_WERROR=ON
          -DBATTERY_PERCENT_SANITIZE=ON
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Test
        run: ctest --test-dir build-asan --output-on-failure

  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        run: pio run -d examples/platformio
      - name: Run
        run: examples/platformio/.pio/build/native/program
      - name: Pack
        run: pio pkg pack -o "$RUNNER_TEMP"

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate
        run: python3 scripts/generate-chart.py
      - name: Up to date
        run: |
          if ! git diff --exit-code docs; then
            echo "::error::The README chart is out of date, run scripts/generate-chart.py"
            exit 1
          fi

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gcovr
        run: pip install gcovr
      - name: C coverage
        run: |
          cmake -S . -B build-coverage -DCMAKE_C_COMPILER=gcc -DBATTERY_PERCENT_COVERAGE=ON
          cmake --build build-coverage --parallel
          ctest --test-dir build-coverage --output-on-failure
          gcovr --root . --filter src/ --xml c-coverage.xml --print-summary build-coverage
      - name: Rust coverage
        run: cargo llvm-cov --lcov --output-path rust-coverage.lcov
      - name: Upload C coverage
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: c-coverage.xml
          flags: c
          fail_ci_if_error: true
      - name: Upload Rust coverage
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: rust-coverage.lcov
          flags: rust
          fail_ci_if_error: true
