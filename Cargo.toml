[package]
name = "battery-percent"
version = "2.0.1"
edition = "2024"
rust-version = "1.88"
description = "Turn a battery voltage into a realistic charge percentage: LiPo, Li-ion 18650, LiFePO4, NiMH and alkaline discharge curves for embedded no_std, backed by a tiny C99 core"
authors = ["Alix ANNERAUD <alix@anneraud.fr>"]
license = "MIT"
repository = "https://github.com/AlixANNERAUD/battery-percent"
homepage = "https://github.com/AlixANNERAUD/battery-percent"
documentation = "https://docs.rs/battery-percent"
readme = "README.md"
keywords = ["battery", "lipo", "state-of-charge", "embedded", "no-std"]
categories = ["embedded", "no-std", "hardware-support"]
links = "battery_percent"
build = "build.rs"
include = [
    "/src/lib.rs",
    "/src/battery_percent.c",
    "/include/battery_percent.h",
    "/build.rs",
    "/tests/battery_percent.rs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[lib]
name = "battery_percent"
path = "src/lib.rs"

[build-dependencies]
cc = "1"
