name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    if: github.repository_owner == 'AlixANNERAUD'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Version consistency
        run: |
          scripts/sync-version.sh
          if ! git diff --exit-code; then
            echo "::error::C manifest versions differ from the Cargo version, run scripts/sync-version.sh"
            exit 1
          fi

      - name: Test
        run: cargo test

      - name: Package
        run: cargo package

  release-plz-release:
    needs: validate
    if: github.repository_owner == 'AlixANNERAUD'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@v5

      - name: Release
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Released version
        id: version
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          version=$(echo "$RELEASES" | jq -r '.[] | select(.package_name == "battery-percent") | .version')
          echo "Released battery-percent $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish-platformio:
    needs: release-plz-release
    if: needs.release-plz-release.outputs.version != ''
    permissions:
      contents: read
    uses: ./.github/workflows/publish-platformio.yml
    with:
      version: ${{ needs.release-plz-release.outputs.version }}
    secrets:
      PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}

  release-plz-pr:
    needs: validate
    if: github.repository_owner == 'AlixANNERAUD'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@v5

      - name: Release PR
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Check out the Release PR
        if: steps.release-plz.outputs.prs_created == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(steps.release-plz.outputs.pr).head_branch }}
          token: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
          path: release-pr

      - name: Sync C manifest versions
        if: steps.release-plz.outputs.prs_created == 'true'
        working-directory: release-pr
        run: |
          scripts/sync-version.sh
          if git diff --quiet; then
            echo "C manifests already match the Cargo version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "chore: sync c manifest versions"
          git push origin HEAD
